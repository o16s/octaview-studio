changesetBaseRefs:
  - main
  - origin/main

defaultSemverRangePrefix: ""

nodeLinker: node-modules

# @o16s packages (e.g. @o16s/mcap-sheets) are hosted on GitHub Packages, which
# requires a token even for reads. Set GITHUB_TOKEN (a PAT with read:packages
# locally; the built-in token in CI, which needs `permissions: packages: read`).
npmScopes:
  o16s:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAlwaysAuth: true
    npmAuthToken: "${GITHUB_TOKEN-}"

patchFolder: ./patches

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-interactive-tools.cjs
    spec: "@yarnpkg/plugin-interactive-tools"
  - path: .yarn/plugins/@yarnpkg/plugin-typescript.cjs
    spec: "@yarnpkg/plugin-typescript"
  - path: .yarn/plugins/@yarnpkg/plugin-version.cjs
    spec: "@yarnpkg/plugin-version"
  - path: .yarn/plugins/@yarnpkg/plugin-workspace-tools.cjs
    spec: "@yarnpkg/plugin-workspace-tools"

yarnPath: .yarn/yarn-wrapper.js
